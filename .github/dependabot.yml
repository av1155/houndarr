version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Let a freshly published version sit before proposing it, so a
    # compromised release is more likely to be pulled first. Security
    # updates are exempt from cooldown, so patches are not delayed.
    cooldown:
      default-days: 7
    groups:
      production-deps:
        patterns:
          - "fastapi"
          - "uvicorn"
          - "jinja2"
          - "aiosqlite"
          - "httpx"
          - "bcrypt"
          - "cryptography"
          - "itsdangerous"
          - "python-multipart"
          - "click"
      dev-deps:
        patterns:
          - "ruff"
          - "mypy"
          - "pytest*"
          - "anyio"
          - "respx"
          - "setuptools"

  # npm (Docusaurus docs site)
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      production-deps:
        dependency-type: production
        update-types:
          - minor
          - patch
      dev-deps:
        dependency-type: development
        update-types:
          - minor
          - patch

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  # Dockerfile base images. Required: the FROM lines are digest-pinned, so
  # without this the bases never pick up upstream security patches.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      docker-base-images:
        patterns:
          - "*"
