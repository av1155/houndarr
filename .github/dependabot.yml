version: 2
updates:
  # Python dependencies
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Let a freshly published version sit before proposing it, so a
    # compromised release is more likely to be pulled first. Security
    # updates are exempt from cooldown, so patches are not delayed.
    cooldown:
      default-days: 7
    groups:
      production-deps:
        patterns:
          - "fastapi"
          - "starlette"
          # The uv parser names it uvicorn[standard]; patterns match whole names.
          - "uvicorn*"
          - "jinja2"
          - "markupsafe"
          - "aiosqlite"
          - "httpx"
          - "bcrypt"
          - "cryptography"
          - "itsdangerous"
          - "python-multipart"
          - "click"
          - "pydantic"
          # pyproject lists it under dev, but the image ships it as a transitive dependency.
          - "anyio"
      dev-deps:
        patterns:
          - "ruff"
          - "mypy"
          - "pytest*"
          - "respx"
          - "setuptools"

  # npm (Docusaurus docs site)
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      # TypeScript 7 removed the `baseUrl` compiler option that
      # `@docusaurus/tsconfig` still sets, and an extending config cannot
      # unset an inherited option. Revisit when Docusaurus drops it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      production-deps:
        dependency-type: production
        update-types:
          - minor
          - patch
      dev-deps:
        dependency-type: development
        update-types:
          - minor
          - patch

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  # Dockerfile base images. Required: the FROM lines are digest-pinned, so
  # without this the bases never pick up upstream security patches.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # No cooldown: on a floating tag like python:3.14-slim the cooldown runs
    # from the tag's last push, so each re-push inside the window withdraws
    # the open digest PR. Exclude every image; omitting the block falls back
    # to a 3-day default.
    cooldown:
      exclude:
        - "*"
    ignore:
      # Odd-numbered Node majors are Current, not LTS, and Dependabot has
      # no concept of the release line. Node 25 also dropped the bundled
      # corepack the css-build stage relies on. Move the LTS line by hand.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # The Python line moves by hand together with the CI test matrix, so
      # only digest refreshes of the current tag come through.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      docker-base-images:
        patterns:
          - "*"
