name: Dependency Review

# Check PR dependency changes against the GitHub Advisory Database.
# Catches newly introduced vulnerable packages at review time before
# pip-audit runs post-install.  This is a required status check, skipped
# on docs-only PRs.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Docs-only check
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/docs-only.yml
    permissions:
      pull-requests: read

  dependency-review:
    name: Dependency review
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
