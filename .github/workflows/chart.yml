name: Helm Chart

on:
  push:
    tags: ["v*"]

# Permissions set at job level for least-privilege.
permissions: {}

jobs:
  publish:
    name: Package and push Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: "v3.20.1"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: version
        run: |
          CHART_VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Package chart
        env:
          CHART_VERSION: ${{ steps.version.outputs.version }}
        run: |
          helm package charts/houndarr \
            --version "$CHART_VERSION" \
            --app-version "v${CHART_VERSION}" \
            --destination /tmp/helm-output

      - name: Push chart to GHCR
        env:
          CHART_VERSION: ${{ steps.version.outputs.version }}
          CHART_OWNER: ${{ github.repository_owner }}
        run: |
          helm push \
            "/tmp/helm-output/houndarr-${CHART_VERSION}.tgz" \
            "oci://ghcr.io/${CHART_OWNER}/charts"
