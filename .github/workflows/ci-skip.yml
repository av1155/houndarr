name: CI Skip (docs-only)

# Provide passing required-check statuses when a PR touches only
# documentation or agent-config files.  The security, dependency review,
# docker and smoke test workflows use paths-ignore to skip these paths, so
# without this shim their required checks would never report and the PR
# would stay blocked by branch protection.  Quality and Tests run on every
# PR (ruff and the tests read these paths), so their checks are not stubbed.

on:
  pull_request:
    paths:
      - "docs/**"
      - "**/*.md"
      - "website/**"
      - ".claude/**"
      - "scripts/marketing/**"

permissions:
  contents: read

concurrency:
  group: ci-skip-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  skip-checks:
    name: CI Skip (docs-only)
    permissions:
      # Publishing the no-op check runs that satisfy branch protection.
      checks: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const checks = [
              'Dependency audit (pip-audit)',
              'SAST (bandit)',
              'Trivy filesystem scan',
              'Dependency review',
              'Build (no push)',
              'Trivy image scan',
              'Security smoke test',
              'Version consistency',
            ];
            const sha = context.payload.pull_request.head.sha;
            const now = new Date().toISOString();
            for (const name of checks) {
              try {
                await github.rest.checks.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  head_sha: sha,
                  name,
                  status: 'completed',
                  conclusion: 'success',
                  completed_at: now,
                  output: {
                    title: 'Skipped (docs-only)',
                    summary: 'Docs-only change; CI check not required.',
                  },
                });
                core.info(`Created check run: ${name}`);
              } catch (error) {
                core.setFailed(
                  `Failed to create check run "${name}": ${error.message}`
                );
                throw error;
              }
            }
            core.info(`All ${checks.length} check runs created`);
