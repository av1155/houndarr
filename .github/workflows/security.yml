name: Security

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "website/**"
      - ".claude/**"
      - "scripts/marketing/**"
  schedule:
    # Every Monday at 09:00 UTC
    - cron: "0 9 * * 1"
  # Manual re-scan handle for when a website-only fix lands and the
  # next cron is too far out to clear stale alerts.  Most relevant
  # for pnpm-lock.yaml CVE bumps where the fix PR's paths-ignore
  # excludes website/** so the PR-time Trivy run is skipped.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install pip-audit
        run: uv tool install pip-audit

      - name: Generate requirements files from uv.lock
        # pyproject.toml + uv.lock are the single source of truth. Generate
        # the requirements files at audit time so they can never drift.
        # --no-emit-project drops the editable `-e .` line so pip-audit only
        # sees the third-party dependencies.
        run: |
          uv export --frozen --no-hashes --no-emit-project --no-dev -o requirements.txt
          uv export --frozen --no-hashes --no-emit-project --only-group dev -o requirements-dev.txt

      - name: Run dependency audit
        env:
          # Space-separated CVE IDs with no upstream fix available yet.
          # Remove entries as fix versions are released.
          # Leave blank when no ignores are needed.
          # CVE-2026-4539: pygments (transitive via pytest/rich), no fix version
          PIP_AUDIT_IGNORE: "CVE-2026-4539"
        shell: bash
        run: |
          args=(pip-audit -r requirements.txt -r requirements-dev.txt)
          for cve in $PIP_AUDIT_IGNORE; do
            args+=(--ignore-vuln "$cve")
          done
          "${args[@]}"

  sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run bandit
        run: uv run bandit -r src/ -c pyproject.toml

  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy filesystem scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: "true"
          exit-code: "1"

      # Upload SARIF to the GitHub Security tab for non-fork runs.
      # Fork PRs lack security-events: write so this step is skipped.
      - name: Run Trivy (SARIF for GitHub Security tab)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: "true"
          exit-code: "0"

      - name: Upload Trivy SARIF to GitHub Security tab
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-filesystem
