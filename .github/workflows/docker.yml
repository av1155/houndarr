name: Docker

on:
  push:
    tags: ["v*"]
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "website/**"
      - ".claude/**"
      - "scripts/marketing/**"
  schedule:
    # Every Sunday at 06:00 UTC, build main's amd64 image and upload its
    # Trivy scan to code scanning, so main's image is scanned between code
    # PRs.  The same run builds arm64 as a canary, since PR builds skip
    # arm64 for speed.  Nothing is pushed.
    - cron: "0 6 * * 0"
  workflow_dispatch:

# Permissions set at job level for least-privilege.
permissions: {}

concurrency:
  # The event name keeps a manual run on a tag ref from cancelling that
  # tag's release run.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build ${{ startsWith(github.ref, 'refs/tags/v') && '+ Push' || '(no push)' }}
    # A manual run on a tag ref would pass the tag-gated publish steps
    # below, so manual runs build branches only.
    if: github.event_name != 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # contents: write attaches the provenance bundle to the release; the
      # steps that use it are gated on a tag push, and a fork PR token is
      # read-only regardless.
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      # Avoid the post-build summary upload that has caused workflow hangs.
      # See docker/build-push-action#1156.
      DOCKER_BUILD_SUMMARY: "false"
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # QEMU is only needed when an arm64 build will actually run.
      # Regular PRs are amd64 native; bump PRs (chore/bump-*) and tag pushes
      # build the full multi-arch image and need emulation.
      - name: Set up QEMU
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref, 'chore/bump-')
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.GHCR_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Login to GHCR
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Regular PRs: amd64 only, no attestations (fast feedback; Trivy still scans).
      # Bump PRs (chore/bump-*): full multi-arch + provenance/sbom so any arm64
      # break is caught before the tag push (the actual release).
      # Tag pushes: same as bump PRs, plus push to GHCR.
      - name: Build (and push on tag)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref, 'chore/bump-')) && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v') }}
          provenance: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref, 'chore/bump-')) && 'mode=max' || 'false' }}
          sbom: ${{ startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref, 'chore/bump-') }}
          build-args: |
            HOUNDARR_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        id: attest
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # BuildKit already attaches provenance and an SBOM to the image itself,
      # but those live in the registry. Consumers verifying a release from
      # GitHub, and Scorecard's Signed-Releases check, only ever look at
      # release assets, so the same bundle is attached there too.
      #
      # release.yml creates the release from this same tag push and finishes
      # long before a multi-arch build does, but the two workflows are
      # independent, so wait for it rather than assume the ordering holds.
      - name: Attach provenance to the GitHub release
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          asset="houndarr-${TAG}.sigstore.json"
          cp "${BUNDLE}" "${asset}"
          for _ in $(seq 1 30); do
            if gh release view "${TAG}" >/dev/null 2>&1; then
              gh release upload "${TAG}" "${asset}" --clobber
              exit 0
            fi
            sleep 10
          done
          echo "::error::Release ${TAG} never appeared; provenance not attached."
          exit 1

  arm64-canary:
    name: arm64 canary build
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      DOCKER_BUILD_SUMMARY: "false"
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build linux/arm64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: false
          provenance: false
          sbom: false
          build-args: |
            HOUNDARR_VERSION=arm64-canary
          # Own scope, so this export does not replace the amd64 cache the
          # build job writes in the same run.
          cache-from: type=gha,scope=arm64-canary
          cache-to: type=gha,scope=arm64-canary,mode=max

  scan:
    name: Trivy image scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build a single-platform image and load it into the local daemon
      # for Trivy to scan.  It keeps the default HOUNDARR_VERSION, which the
      # Dockerfile bakes in above the apt and pip layers, so only the
      # css-build stage can come from the build job's cache.
      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: houndarr:scan
          cache-from: type=gha

      - name: Run Trivy vulnerability scanner
        id: trivy-gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: houndarr:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: "true"
          exit-code: "1"
          # Same Trivy as the filesystem scans, so all three share one cached
          # binary and report from the same scanner.
          version: v0.76.2

      # Upload SARIF to the GitHub Security tab for non-fork runs, whether the
      # gate above passed or failed, so failing findings still reach the tab.
      # Fork PRs lack security-events: write so these steps are skipped.
      - name: Run Trivy (SARIF for GitHub Security tab)
        id: trivy-sarif
        if: >-
          ${{ !cancelled()
          && (steps.trivy-gate.outcome == 'success' || steps.trivy-gate.outcome == 'failure')
          && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: houndarr:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: "true"
          exit-code: "0"
          # Reuses the gate's binary and DB; a second cache restore can put an
          # older cached DB back over it and force another download.
          skip-setup-trivy: "true"
          cache: "false"

      - name: Upload Trivy SARIF to GitHub Security tab
        if: ${{ !cancelled() && steps.trivy-sarif.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image
